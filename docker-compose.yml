version: '3.8'

services:
  medical-platform:
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - "8000:8000"
    environment:
      - PORT=8000
      - HOST=0.0.0.0
      - DATABASE_URL=sqlite:///./backend/database/predictions.db
      - CONFIDENCE_THRESHOLD=0.70
      - LOG_LEVEL=INFO
    env_file:
      - .env
    volumes:
      # Persist SQLite database
      - db_data:/app/backend/database
      # Persist uploaded original files and Grad-CAM results
      - uploads_data:/app/backend/static
      # Persist application logs
      - logs_data:/app/logs
    restart: always

volumes:
  db_data:
  uploads_data:
  logs_data:
